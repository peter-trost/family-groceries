# Publishes the Flutter web app to GitHub Pages, against the production
# Supabase project. Manual only (Actions tab, Run workflow). Until Pages is
# enabled for the repo (Settings, Pages, Source: GitHub Actions), the run
# skips with a notice and stays green. docs/NEEDS_PETER.md, "Job 4: web
# hosting", has the one-time steps.
name: Web deploy

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null | grep -qx workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Web deploy skipped: GitHub Pages is not enabled with source 'GitHub Actions' (see docs/NEEDS_PETER.md)."
          fi

  build:
    needs: pages
    if: needs.pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # A project site lives under /<repo>/; the app needs that path for its
      # base href and for the sign-in and invite links it builds.
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          flutter build web --release --no-wasm-dry-run \
            --base-href "${BASE_PATH%/}/" \
            --dart-define=WEB_BASE_PATH="${BASE_PATH%/}" \
            --dart-define-from-file=config/auth.json
          # Pages serves 404.html for unknown paths: deep links like
          # /join/CODE and /oauth/consent then boot the app.
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
