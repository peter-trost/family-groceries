# Deploys migrations and edge functions to the hosted project from main, over HTTPS only:
# migrations through the Management API (supabase/deploy/migrate.ts), functions bundled by
# Supabase (--use-api). No Postgres connection and no Docker. A missing credential fails the run.
name: Supabase deploy

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check deploy credentials
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing secret SUPABASE_ACCESS_TOKEN,"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing variable SUPABASE_PROJECT_REF,"
          if [ -n "$missing" ]; then
            echo "::error::Nothing was deployed. Missing:${missing%,} (docs/NEEDS_PETER.md, section 1)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Migrations
        run: deno run --allow-read --allow-env --allow-net --config supabase/deploy/deno.json supabase/deploy/migrate.ts
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Edge functions
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Smoke test
        run: |
          base="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1"
          curl -fsS "$base/health" | grep -q '"ok":true'
          curl -fsS "$base/mcp/.well-known/oauth-protected-resource" | grep -q '"resource"'
          echo "health and mcp metadata answer on $base"
